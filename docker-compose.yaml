version: "3.8"

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: e-penilaian
    volumes:
      - .:/var/www/
    restart: always
    env_file:
      - .env
    networks:
      - e-penilaian_network

  nginx:
    image: nginx:alpine
    container_name: e-penilaian_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www
    depends_on:
      - php
    networks:
      - e-penilaian_network
    
  mysql:
    image: mysql:8.0
    container_name: e-penilaian_database
    restart : always
    env_file:
      - .env
    ports:
      - "3306:"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - e-penilaian_network

volumes:
  mysql_data:
networks:
  e-penilaian_network:
    driver : bridge